yaml
name: petdeal
on:
  schedule:
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: petdeal
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml
      - name: 수집·판정·발송·사이트 생성
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python run.py
      - name: 가격 이력·사이트 저장
        run: |
          git config user.name "petdeal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/petdeal.sqlite data/deals.json docs/index.html site/index.html
          git commit -m "run $(date -u +%Y-%m-%dT%H:%M)" || echo "변경 없음"
          git push
